# The desktop application built on a Mac, on Windows and on Linux, its Rust
# tested on each, and what each makes kept as an artifact of the run: a .dmg,
# an installer for Windows, a .deb and an AppImage. Run by hand, and on a pull
# request that touches it.
#
# Signed when the secrets are there, and not otherwise (an application that
# runs, with a warning the first time):
#   Mac      APPLE_CERTIFICATE (a .p12 in base64), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY; and for notarizing APPLE_ID,
#            APPLE_PASSWORD (one of the app), APPLE_TEAM_ID.
#   Windows  WINDOWS_CERTIFICATE (a .pfx in base64), WINDOWS_CERTIFICATE_PASSWORD.

name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', 'packages/sync/**', 'packages/drive/**']

env:
  HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: What Tauri needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - name: The certificate of Windows, when there is one
        if: runner.os == 'Windows' && env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $thumb = (Get-PfxData -FilePath cert.pfx -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)).EndEntityCertificates[0].Thumbprint
          Remove-Item cert.pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $thumb; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
          $config | ConvertTo-Json -Depth 4 | Set-Content apps/desktop/src-tauri/signing.json
          "SIGNING=--config src-tauri/signing.json" >> $env:GITHUB_ENV
      - name: Build
        run: npm run build:desktop -- ${{ env.SIGNING }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: rebofiles-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
